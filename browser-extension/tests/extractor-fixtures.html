<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>动态网页采集器测试</title>
</head>
<body>
  <main id="fixture"></main>
  <script src="../collection.js"></script>
  <script src="../extractors.js"></script>
  <script>
    (async function () {
      'use strict';

      var failures = [];

      function assert(condition, message) {
        if (!condition) failures.push(message);
      }

      function resetFixture() {
        var fixture = document.getElementById('fixture');
        fixture.innerHTML = '';
        return fixture;
      }

      async function testFeishuShadowAndVirtualScroll() {
        var fixture = resetFixture();
        var scroller = document.createElement('div');
        scroller.className = 'docx-scroll-container';
        scroller.style.cssText = 'height:120px;overflow:auto;';
        var spacer = document.createElement('div');
        spacer.style.height = '1200px';
        var host = document.createElement('div');
        var shadow = host.attachShadow({ mode: 'open' });
        var editor = document.createElement('article');
        editor.className = 'docx-editor';
        editor.innerHTML = '<h1>飞书项目规则</h1><p>第一章：适用范围与申请条件。</p>';
        shadow.appendChild(editor);
        scroller.appendChild(host);
        scroller.appendChild(spacer);
        fixture.appendChild(scroller);

        var appended = false;
        scroller.addEventListener('scroll', function () {
          if (appended) return;
          appended = true;
          var paragraph = document.createElement('p');
          paragraph.textContent = '最后一章：违规处理与申诉流程。';
          editor.appendChild(paragraph);
        });

        var result = await window.JiwaiPageExtractor.extract({
          document: document,
          url: 'https://example.feishu.cn/docx/rule',
          maxWaitMs: 1200
        });
        assert(result.adapterId === 'feishu', '未命中飞书适配器');
        assert(result.markdown.indexOf('# 飞书项目规则') !== -1, '飞书标题未保留');
        assert(result.markdown.indexOf('违规处理与申诉流程') !== -1, '虚拟滚动后半段未采集');
      }

      async function testDouyinDelayedContent() {
        var fixture = resetFixture();
        var shell = document.createElement('div');
        shell.className = 'rule-content';
        fixture.appendChild(shell);
        window.setTimeout(function () {
          shell.innerHTML = '<h2>抖店内容规范</h2><p>直播间不得发布虚假宣传信息，商家须保存相关凭证。</p>';
        }, 280);

        var result = await window.JiwaiPageExtractor.extract({
          document: document,
          url: 'https://school.jinritemai.com/doudian/web/article/123',
          maxWaitMs: 1800
        });
        assert(result.adapterId === 'douyin-rules', '未命中抖音规则适配器');
        assert(result.markdown.indexOf('直播间不得发布虚假宣传信息') !== -1, '异步规则正文未采集');
      }

      async function testTableAndLinkMarkdown() {
        var fixture = resetFixture();
        fixture.innerHTML = [
          '<article>',
          '<h1>办公文档</h1>',
          '<table><thead><tr><th>项目</th><th>要求</th></tr></thead>',
          '<tbody><tr><td>归档</td><td>每周完成</td></tr></tbody></table>',
          '<p><a href="/policy">查看完整制度</a></p>',
          '</article>'
        ].join('');

        var result = await window.JiwaiPageExtractor.extract({
          document: document,
          url: 'https://intranet.example.com/docs/weekly',
          maxWaitMs: 900
        });
        assert(result.markdown.indexOf('| 项目 | 要求 |') !== -1, '表格未转换为 Markdown');
        assert(result.markdown.indexOf('[查看完整制度](https://intranet.example.com/policy)') !== -1, '相对链接未转换为绝对地址');
      }

      function testEmbeddedOfficeHosts() {
        assert(
          window.JiwaiPageExtractor.findAdapter('https://bytedance.larkoffice.com/docx/example').id === 'feishu',
          '巨量引擎内嵌飞书文档未命中适配器'
        );
        assert(
          window.JiwaiPageExtractor.findAdapter('https://support.oceanengine.com/support/content/140628').id === 'douyin-rules',
          '巨量引擎帮助中心未命中适配器'
        );
        assert(
          window.JiwaiPageExtractor.findAdapter('https://www.lifexue.com/course/detail/123').id === 'lifexue',
          '抖音生活服务学习中心未命中适配器'
        );
      }

      function testLarkOpenDocLinkSanitizing() {
        var fixture = resetFixture();
        fixture.innerHTML = [
          '<article>',
          '<a href="https://bytedance.larkoffice.com/docx/example?edition_id=v2&opendoc=1&encrypt_jssdk_session=secret">规则正文</a>',
          '<img src="data:image/png;base64,AAAA" alt="内嵌图片">',
          '</article>'
        ].join('');
        var markdown = window.JiwaiPageExtractor.toMarkdown(fixture.firstElementChild, location.href);
        assert(markdown.indexOf('edition_id=v2') !== -1, '飞书版本号未保留');
        assert(markdown.indexOf('encrypt_jssdk_session') === -1, '飞书临时加密会话未清理');
        assert(markdown.indexOf('data:image') === -1, 'base64 内嵌图片未清理');
      }

      async function testFeishuBlockSemantics() {
        var fixture = resetFixture();
        fixture.innerHTML = [
          '<div class="docx-page-block" data-block-type="page">',
          '<div data-block-id="1" data-record-id="heading" data-block-type="heading1"><span>一级标题</span></div>',
          '<div data-block-id="2" data-record-id="callout" data-block-type="callout">💡<div data-block-type="text"><span style="font-weight:bold;">重点提示</span></div></div>',
          '<div data-block-id="4" data-record-id="table" data-block-type="table"><table><tbody>',
          '<tr><td><div data-block-type="text">项目</div></td><td><div data-block-type="text">要求</div></td></tr>',
          '<tr><td><div data-block-type="text">归档</div></td><td><div data-block-type="text">每周完成</div></td></tr>',
          '</tbody></table></div>',
          '<div data-block-id="9" data-record-id="image" data-block-type="image"><img alt="流程图" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="></div>',
          '<div data-block-id="10" data-record-id="view" data-block-type="view"><div data-block-id="10-1" data-record-id="file" data-block-type="file">附件不支持打印 加载失败，点击重试 产品说明书<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4="></div></div>',
          '<div data-block-id="11" data-record-id="placeholder" data-block-type="image">加载失败，点击重试 操作截图<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4="></div>',
          '</div>'
        ].join('');
        var result = await window.JiwaiPageExtractor.extract({
          document: document,
          url: 'https://bytedance.larkoffice.com/docx/example',
          maxWaitMs: 900
        });
        assert(result.markdown.indexOf('# 一级标题') !== -1, '飞书标题层级未保留');
        assert(result.markdown.indexOf('> 💡 **重点提示**') !== -1, '飞书 Callout 或加粗样式未保留');
        assert(result.markdown.indexOf('| 项目 | 要求 |') !== -1, '飞书表格未保留');
        assert(result.markdown.indexOf('![流程图](data:image/gif;base64,') !== -1, '飞书图片未保留');
        assert(result.markdown.indexOf('> 附件：产品说明书') !== -1, '飞书附件未转换为附件说明');
        assert(result.markdown.indexOf('data:image/svg+xml') === -1, '加载失败占位图被错误内嵌');
      }

      async function testOceanEngineEmbeddedShell() {
        var fixture = resetFixture();
        fixture.innerHTML = '<main><h1>巨量外壳标题</h1><tt-docs-component src="https://example.feishu.cn/docx/test"></tt-docs-component><p>上一篇</p><p>下一篇</p></main>';
        var result = await window.JiwaiPageExtractor.extract({
          document: document,
          url: 'https://support.oceanengine.com/support/content/147621',
          maxWaitMs: 300
        });
        assert(result.adapterId === 'oceanengine-shell', '巨量内嵌文档外壳未单独标记');
        assert(result.incomplete === true, '巨量内嵌文档外壳未标记为不完整');
      }

      async function testDocumentCollectionDiscovery() {
        var fixture = resetFixture();
        var sidebar = document.createElement('aside');
        sidebar.className = 'docs-sidebar';
        sidebar.style.cssText = 'height:100px;overflow:auto;';
        sidebar.innerHTML = [
          '<a href="/support/content/140962?timestamp=123">第一篇文档</a>',
          '<details><summary>第二章</summary><a href="/support/content/140963?pageId=305">第二篇文档</a></details>',
          '<div data-url="/support/content/140964">第三篇文档</div>',
          '<div class="base-tree-file">组件路由第五篇</div>',
          '<a href="/login">登录</a>',
          '<a href="https://outside.example.com/support/content/1">外部文档</a>',
          '<div style="height:700px"></div>'
        ].join('');
        fixture.appendChild(sidebar);

        var frameworkNode = sidebar.querySelector('.base-tree-file');
        Object.defineProperty(frameworkNode, '__reactFiber$fixture', {
          value: {
            memoizedProps: {
              data: { data: { mappingId: 140966, mappingType: 2, mappingName: '组件路由第五篇' } }
            },
            return: null
          }
        });

        var appended = false;
        sidebar.addEventListener('scroll', function () {
          if (appended) return;
          appended = true;
          var link = document.createElement('a');
          link.href = '/support/content/140965';
          link.textContent = '虚拟列表第四篇';
          sidebar.appendChild(link);
        });

        var result = await window.JiwaiCollection.discoverDocumentLinks(
          document,
          'https://support.oceanengine.com/support/content/140962?mappingType=2&timestamp=999',
          { maxPages: 50 }
        );
        var urls = result.pages.map(function (page) { return page.url; });
        assert(urls[0] === 'https://support.oceanengine.com/support/content/140962?mappingType=2', '当前文档未排在第一位或临时参数未清理');
        assert(urls.indexOf('https://support.oceanengine.com/support/content/140963?pageId=305') !== -1, '折叠目录文档未识别');
        assert(urls.indexOf('https://support.oceanengine.com/support/content/140964') !== -1, 'data-url 文档未识别');
        assert(urls.indexOf('https://support.oceanengine.com/support/content/140965') !== -1, '虚拟滚动目录文档未识别');
        assert(urls.indexOf('https://support.oceanengine.com/support/content/140966?mappingType=2') !== -1, '组件树结构化路由未识别');
        assert(urls.every(function (url) { return url.indexOf('outside.example.com') === -1 && url.indexOf('/login') === -1; }), '外链或危险路径未过滤');
        assert(window.JiwaiCollection.isNavigationOnlyUrl('https://docs.example.com/category/api'), '分类页未标记为导航页');
        assert(!window.JiwaiCollection.isNavigationOnlyUrl('https://docs.example.com/docs/api'), '正文页被错误标记为导航页');
      }

      await testFeishuShadowAndVirtualScroll();
      await testDouyinDelayedContent();
      await testTableAndLinkMarkdown();
      testEmbeddedOfficeHosts();
      testLarkOpenDocLinkSanitizing();
      await testFeishuBlockSemantics();
      await testOceanEngineEmbeddedShell();
      await testDocumentCollectionDiscovery();

      var status = failures.length ? 'fail' : 'pass';
      document.body.textContent = failures.length ? 'EXTENSION_TEST_FAIL\n' + failures.join('\n') : 'EXTENSION_TEST_PASS';
      document.documentElement.setAttribute('data-test-result', status);
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        fetch('/__result?status=' + status + '&details=' + encodeURIComponent(failures.join('|'))).catch(function () {});
      }
    })();
  </script>
</body>
</html>
